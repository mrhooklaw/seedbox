
services:

  ########################################################################
  # Flood
  ########################################################################

  flood-base:
    image: ghcr.io/chris3481/flood:latest
    restart: unless-stopped
    environment:
      - USER_UID=${USER_ID:-1000}
      - USER_GID=${GROUP_ID:-1000}
      - FLOOD_ADMIN_USERNAME=${FLOOD_ADMIN_USERNAME:-}
      - FLOOD_ADMIN_PASSWORD=${FLOOD_ADMIN_PASSWORD:-}
    volumes:
      - ${BASE_PATH:-/home/pi/seedbox}/docker/flood/config.js:/data/flood/config.js
      - ${DOWNLOAD_FOLDER_PATH:-/home/pi/seedbox/downloads}:/srv/rtorrent/download

  flood-vpn:
    extends:
      service: flood-base
    network_mode: service:vpn
    profiles:
      - vpn

  flood-standalone:
    extends:
      service: flood-base
    ports:
      - "3000:3000"
    networks:
      - seedbox-network
    profiles:
      - standalone

  ########################################################################
  # rTorrent
  ########################################################################

  rtorrent-base:
    image: ghcr.io/chris3481/rtorrent:latest
    restart: unless-stopped
    environment:
      - USER_UID=${USER_ID:-1000}
      - USER_GID=${GROUP_ID:-1000}
    volumes:
      - ${BASE_PATH:-/home/pi/seedbox}/docker/rtorrent/config.d:/srv/rtorrent/config.d
      - ${DOWNLOAD_FOLDER_PATH:-/home/pi/seedbox/downloads}:/srv/rtorrent/download
      - ${BASE_PATH:-/home/pi/seedbox}/logs:/srv/rtorrent/log
      - ${BASE_PATH:-/home/pi/seedbox}/data/rtorrent/sessions:/srv/rtorrent/.session

  rtorrent-vpn:
    extends:
      service: rtorrent-base
    network_mode: service:vpn
    profiles:
      - vpn

  rtorrent-standalone:
    extends:
      service: rtorrent-base
    ports:
      - "16891:16891"
      - ${RTORRENT_DHT_PORT:-6882}:${RTORRENT_DHT_PORT:-6882}
      - ${RTORRENT_PEER_PORT:-50000}:${RTORRENT_PEER_PORT:-50000}
    networks:
      - seedbox-network
    profiles:
      - standalone

  ########################################################################
  # VPN
  ########################################################################

  vpn:
    container_name: vpn
    restart: unless-stopped
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1194:1194/udp"
      - ${FLOOD_PORT:-3000}:${FLOOD_PORT:-3000}
      - "16891:16891"
      - ${RTORRENT_PEER_PORT:-50000}:${RTORRENT_PEER_PORT:-50000}
      - ${RTORRENT_DHT_PORT:-6882}:${RTORRENT_DHT_PORT:-6882}
      - ${QBITTOTTENT_PEER_PORT:-6881}:${QBITTOTTENT_PEER_PORT:-6881}
    volumes:
      - ${BASE_PATH:-/home/pi/seedbox}/vpn:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - OPENVPN_CUSTOM_CONFIG=/gluetun/raspberry.ovpn
      - FIREWALL=on
      - FIREWALL_VPN_INPUT_PORTS=3000,${RTORRENT_PEER_PORT:-50000},${RTORRENT_DHT_PORT:-6882},${QBITTOTTENT_PEER_PORT:-6881}
      - FIREWALL_DEBUG=on
      - TZ=${TIMEZONE:-Europe/Paris}
    profiles:
      - vpn

  ########################################################################
  # Local Services
  ########################################################################

  samba:
    image: dperson/samba:armhf
    container_name: samba
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}
      USERID: ${USER_ID:-1000}
      GROUPID: ${GROUP_ID:-1000}
      NMBD: "true"
      WORKGROUP: "WORKGROUP"
      SHARE: "raspberry;/mnt;yes;no;yes;all;'none';'none';'Raspberry'"
    ports:
      - "137:137/udp"
      - "138:138/udp"
      - "139:139/tcp"
      - "445:445/tcp"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ${DOWNLOAD_FOLDER_PATH:-/home/pi/seedbox/downloads}:/mnt:z

  minidlna:
    container_name: minidnla
    restart: unless-stopped
    image: cytomich/rpi-docker-minidlna
    volumes:
      - ${DOWNLOAD_FOLDER_PATH:-/home/pi/seedbox/downloads}:/media:z
    environment:
      - MINIDLNA_MEDIA_DIR=/media
      - MINIDLNA_PORT=8200
      - MINIDLNA_FRIENDLY_NAME=Raspberry
    network_mode: "host"

  filebrowser:
    container_name: filebrowser
    restart: unless-stopped
    image: filebrowser/filebrowser
    ports:
      - "8080:80"
    volumes:
      - ${BASE_PATH:-/home/pi/seedbox}/data/filebrowser/data:/data
      - ${BASE_PATH:-/home/pi/seedbox}/data/filebrowser/config:/config
      - ${DOWNLOAD_FOLDER_PATH:-/home/pi/seedbox/downloads}/:/srv
    environment:
      - FB_BASEURL=${DOWNLOAD_FOLDER_PATH:-/home/pi/seedbox/downloads}

  ########################################################################
  # Streaming
  ########################################################################

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${USER_ID:-1000}
      - PGID=${GROUP_ID:-1000}
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${BASE_PATH:-/home/pi/seedbox}/data/jellyfin:/config
      - ${DOWNLOAD_FOLDER_PATH:-/home/pi/seedbox/downloads}:/data/movies
    ports:
      - 8096:8096
    restart: unless-stopped
    profiles:
      - vpn


networks:
  seedbox-network:
    driver: bridge
